<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test widgets INI</title>
<style>
  body {
    background: #0a0c12; color: #e6e8ee;
    font-family: "Segoe UI", sans-serif; padding: 30px; max-width: 720px; margin: auto;
  }
  h1 { font-size: 20px; margin-bottom: 20px; color: #7ab8ff; }
  h2 { font-size: 14px; margin: 24px 0 10px; color: #8a94a8; text-transform: uppercase; letter-spacing: 1px; }

  /* ---- Style des widgets (à réutiliser plus tard dans style.css) ---- */
  .ini-row {
    display: grid;
    grid-template-columns: 240px 1fr;
    align-items: center;
    gap: 14px;
    padding: 8px 12px;
    border-radius: 6px;
    transition: background 0.15s;
  }
  .ini-row:hover { background: rgba(122, 184, 255, 0.06); }

  .ini-label {
    font-size: 13px;
    color: #c9cfdb;
    cursor: pointer;
    user-select: none;
  }
  .ini-unit { color: #6b7h; color: #6b7688; font-size: 11px; }

  .ini-checkbox {
    width: 18px; height: 18px;
    accent-color: #4c9aff;
    cursor: pointer;
  }

  .ini-slider-wrap {
    display: flex; align-items: center; gap: 10px;
  }
  .ini-range {
    flex: 1; accent-color: #4c9aff; cursor: pointer;
  }
  .ini-number, .ini-text, .ini-select {
    background: #151922; color: #e6e8ee;
    border: 1px solid #232a38; border-radius: 4px;
    padding: 5px 8px; font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .ini-number { width: 90px; }
  .ini-text   { width: 100%; }
  .ini-select { width: 100%; cursor: pointer; }
  .ini-number:focus, .ini-text:focus, .ini-select:focus {
    border-color: #4c9aff;
  }
  .ini-binding {
    font-family: Consolas, monospace;
    font-size: 12px;
    color: #ffd17a;
  }

  #log {
    margin-top: 30px; padding: 12px;
    background: #0f131b; border-radius: 6px;
    font-family: Consolas, monospace; font-size: 12px;
    color: #8fd67a; max-height: 200px; overflow: auto;
  }
</style>
</head>
<body>
  <h1>🧪 Test widgets INI</h1>
  <p style="color:#8a94a8;font-size:13px;">
    Cette page teste <code>createIniControl()</code>. Modifie n'importe quel champ :
    la nouvelle valeur s'affiche dans le log en bas.
  </p>

  <h2>Booléens</h2>
  <div id="demo-bool"></div>

  <h2>Nombres (slider + champ)</h2>
  <div id="demo-slider"></div>

  <h2>Nombres (champ seul, sans min/max)</h2>
  <div id="demo-number"></div>

  <h2>Menus déroulants</h2>
  <div id="demo-enum"></div>

  <h2>Texte</h2>
  <div id="demo-text"></div>

  <h2>PP Filter</h2>
  <div id="demo-ppfilter"></div>

  <h2>Binding (placeholder)</h2>
  <div id="demo-binding"></div>

  <div id="log">> En attente de modification…</div>

  <!-- Chargement dans l'ordre -->
  <script src="public/src/iniParser.js"></script>
  <script src="public/src/iniSchema.js"></script>
  <script src="public/src/iniControls.js"></script>

  <script>
    const logEl = document.getElementById('log');
    function log(key, value) {
      const line = document.createElement('div');
      line.textContent = `> ${key} = ${JSON.stringify(value)}`;
      logEl.prepend(line);
    }

    const S = window.IniSchema;
    const C = window.IniControls;

    // --- Bool
    document.getElementById('demo-bool').appendChild(
      C.createIniControl({
        filename: 'video.ini', section: 'VIDEO', key: 'FULLSCREEN',
        value: '1',
        schema: S.getKeySchema('video.ini', 'VIDEO', 'FULLSCREEN'),
        onChange: v => log('VIDEO.FULLSCREEN', v)
      }).element
    );

    // --- Slider + number (audio LEVELS.MASTER)
    document.getElementById('demo-slider').appendChild(
      C.createIniControl({
        filename: 'audio.ini', section: 'LEVELS', key: 'MASTER',
        value: '0.64',
        schema: S.getKeySchema('audio.ini', 'LEVELS', 'MASTER'),
        onChange: v => log('LEVELS.MASTER', v)
      }).element
    );

    // --- Slider avec unité (controls STEER.LOCK)
    document.getElementById('demo-slider').appendChild(
      C.createIniControl({
        filename: 'controls.ini', section: 'STEER', key: 'LOCK',
        value: '900',
        schema: S.getKeySchema('controls.ini', 'STEER', 'LOCK'),
        onChange: v => log('STEER.LOCK', v)
      }).element
    );

    // --- Number seul (audio SKIDS.ENTRY_POINT, min/max présents -> slider aussi)
    document.getElementById('demo-number').appendChild(
      C.createIniControl({
        filename: 'controls.ini', section: 'STEER', key: 'DEBOUNCING_MS',
        value: '50',
        schema: S.getKeySchema('controls.ini', 'STEER', 'DEBOUNCING_MS'),
        onChange: v => log('STEER.DEBOUNCING_MS', v)
      }).element
    );

    // --- Enum (controls HEADER.INPUT_METHOD)
    document.getElementById('demo-enum').appendChild(
      C.createIniControl({
        filename: 'controls.ini', section: 'HEADER', key: 'INPUT_METHOD',
        value: 'WHEEL',
        schema: S.getKeySchema('controls.ini', 'HEADER', 'INPUT_METHOD'),
        onChange: v => log('HEADER.INPUT_METHOD', v)
      }).element
    );

    // --- Texte (audio SETTINGS.DRIVER_NAME)
    document.getElementById('demo-text').appendChild(
      C.createIniControl({
        filename: 'audio.ini', section: 'SETTINGS', key: 'DRIVER_NAME',
        value: 'Haut-parleurs (Logitech PRO X)',
        schema: S.getKeySchema('audio.ini', 'SETTINGS', 'DRIVER_NAME'),
        onChange: v => log('SETTINGS.DRIVER_NAME', v)
      }).element
    );

    // --- PP Filter
    document.getElementById('demo-ppfilter').appendChild(
      C.createIniControl({
        filename: 'video.ini', section: 'POST_PROCESS', key: 'FILTER',
        value: 'CDimagined',
        schema: S.getKeySchema('video.ini', 'POST_PROCESS', 'FILTER'),
        ppfilters: ['b&w','blue_steel','CDimagined','default','default_bright','default_dark','movie','natural','photographic','pure','pureCandy','pureHDR','purelinear','pureVR','sepia','vintage'],
        onChange: v => log('POST_PROCESS.FILTER', v)
      }).element
    );

    // --- Binding (placeholder)
    document.getElementById('demo-binding').appendChild(
      C.createIniControl({
        filename: 'controls.ini', section: 'ACTION_HORN', key: 'KEY',
        value: '0x48',
        schema: S.getKeySchema('controls.ini', 'ACTION_HORN', 'KEY'),
        onChange: v => log('ACTION_HORN.KEY', v)
      }).element
    );
  </script>
</body>
</html>
