<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test capture manette</title>
<style>
  body {
    background: #0a0c12; color: #e6e8ee;
    font-family: "Segoe UI", sans-serif; padding: 30px; max-width: 780px; margin: auto;
  }
  h1 { font-size: 20px; color: #7ab8ff; margin-bottom: 20px; }
  button {
    background: #4c9aff; color: #fff; border: none;
    padding: 12px 24px; border-radius: 6px;
    font-size: 0.95rem; font-weight: 600; cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  button:hover:not(:disabled) { background: #6eaaff; }
  button:disabled { opacity: 0.5; cursor: wait; }

  #status {
    margin: 20px 0;
    padding: 12px 16px;
    background: #151922;
    border: 1px solid #232a38;
    border-radius: 6px;
    font-family: Consolas, monospace;
    font-size: 0.85rem;
    min-height: 60px;
    white-space: pre-wrap;
    color: #ffd17a;
  }
  #log {
    margin-top: 20px;
    padding: 12px;
    background: #0f131b;
    border-radius: 6px;
    font-family: Consolas, monospace;
    font-size: 12px;
    color: #8fd67a;
    max-height: 260px;
    overflow: auto;
  }
  .hint { color: #8a94a8; font-size: 0.8rem; margin-bottom: 16px; line-height: 1.6; }
  code { background: #151922; padding: 1px 6px; border-radius: 3px; color: #ffd17a; }
</style>
</head>
<body>
  <h1>🎮 Test capture manette</h1>

  <div class="hint">
    Branche tes pads, appuie sur un bouton pour "réveiller" Chromium, puis clique sur le bouton ci-dessous.<br>
    Ensuite, appuie sur n'importe quel <strong>bouton</strong> d'un pad → il sera capturé.
  </div>

  <button id="btn-capture">▶ Démarrer la capture</button>

  <div id="status">État : inactif</div>

  <div id="log">> En attente…</div>

  <script src="public/src/gamepadMapper.js"></script>
  <script src="public/src/gamepadCapture.js"></script>

  <script>
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('btn-capture');

    function log(msg) {
      const line = document.createElement('div');
      line.textContent = '> ' + msg;
      logEl.prepend(line);
    }

    // Prépare un mapper bidon (juste pour tester le resolveAcIndex)
    // En prod, on lui passera les sections réelles de controls.ini
    const fakeSections = [{
      name: 'CONTROLLERS',
      entries: [
        { kind: 'kv', key: 'CON0', value: 'ODDOR-handbrake' },
        { kind: 'kv', key: 'PGUID0', value: '88881020-0000-0000-0000-504944564944' },
        { kind: 'kv', key: 'CON1', value: 'SparkFun Pro Micro' },
        { kind: 'kv', key: 'PGUID1', value: '92061B4F-0000-0000-0000-504944564944' },
        { kind: 'kv', key: 'CON2', value: 'FANATEC Wheel' },
        { kind: 'kv', key: 'PGUID2', value: '00200EB7-0000-0000-0000-504944564944' },
        { kind: 'kv', key: 'CON3', value: 'FANATEC Wheel' },
        { kind: 'kv', key: 'PGUID3', value: '00200EB7-0000-0000-0000-504944564944' },
        { kind: 'kv', key: 'CON4', value: 'A7 Gear Shift' },
        { kind: 'kv', key: 'PGUID4', value: 'B77211FF-0000-0000-0000-504944564944' },
      ]
    }];

    const mapper = window.GamepadMapper.create(fakeSections);

    // ⚠️ Recalcule le matching à CHAQUE capture (Chromium "réveille" les pads
    //    seulement après le premier appui sur un bouton)
    function logMatchTable() {
      const table = mapper.match();
      log('Table de matching (recalculée) :');
      table.forEach(m => {
        if (m.unmatched) {
          log(`  Chromium #${m.chromiumIndex} : "${(m.chromiumId || '').substring(0, 50)}" (pas d'équivalent AC)`);
        } else if (m.matched) {
          log(`  ✅ AC JOY=${m.acIndex} (${m.acName}) ←→ Chromium #${m.chromiumIndex}`);
        } else {
          log(`  ⚠️ AC JOY=${m.acIndex} (${m.acName}) : PAS DE MATCH`);
        }
      });
    }

    function resolveAcIndex(chromiumIndex) {
      const table = mapper.match();  // ⚠️ recalcul à chaque appel
      const m = table.find(x => x.chromiumIndex === chromiumIndex && x.matched);
      return m ? m.acIndex : null;
    }

    btn.addEventListener('click', () => {
      if (window.GamepadCapture.isCapturing()) {
        window.GamepadCapture.stop();
        statusEl.textContent = 'État : annulé';
        btn.textContent = '▶ Démarrer la capture';
        return;
      }

      statusEl.textContent = '🎯 Capture en cours… Appuie sur un BOUTON ou bouge un AXE (Esc = annule)';
      btn.textContent = '⏹ Annuler';

      logMatchTable();  // ⭐ recalcul au moment du clic

      window.GamepadCapture.start({
        axesThreshold: 0.5,     // ⭐ active la capture d'axes
        timeoutMs: 15000,
        resolveAcIndex,
        onCapture: (r) => {
          const kindLine = r.kind === 'axis'
            ? `Axe ${r.axisIndex} (valeur ${r.value.toFixed(2)})`
            : `Bouton ${r.buttonIndex}`;
          const acLine = r.kind === 'axis'
            ? `AC JOY=${r.acIndex ?? '?'} → AXLE=${r.axisIndex}`
            : `AC JOY=${r.acIndex ?? '?'} → BUTTON=${r.buttonIndex}`;
          statusEl.textContent = `✅ Capturé !
Chromium #${r.chromiumIndex}  →  ${kindLine}
${acLine}
Pad : ${r.padId}`;
          btn.textContent = '▶ Démarrer la capture';
          log(`CAPTURE : Chromium #${r.chromiumIndex} bouton ${r.buttonIndex} → JOY=${r.acIndex}`);
        },
        onCancel: (reason) => {
          statusEl.textContent = 'État : ' + (reason === 'timeout' ? '⏱️ Timeout (15s)' : 'annulé');
          btn.textContent = '▶ Démarrer la capture';
        }
      });

      // Escape pour annuler
      const escHandler = (e) => {
        if (e.key === 'Escape' && window.GamepadCapture.isCapturing()) {
          window.GamepadCapture.stop();
          statusEl.textContent = 'État : annulé par Échap';
          btn.textContent = '▶ Démarrer la capture';
          document.removeEventListener('keydown', escHandler, true);
        }
      };
      document.addEventListener('keydown', escHandler, true);
    });
  </script>
</body>
</html>
